name: Send daily/weekly emails

on:
  schedule:
    # GitHub's cron schedule is best-effort and can fire hours late
    # (observed a 5-6 hour delay on this workflow's first day — actual
    # firings at noon and 1pm Pacific instead of 7am). Poll every 30
    # minutes across a wide chunk of the day so a late trigger still gets
    # caught; the script itself only requires "after 6am Pacific" (no
    # upper bound — late beats not-at-all) and a committed send-state file
    # guarantees it only actually sends once per day no matter how many of
    # these triggers land after that point.
    - cron: "*/30 12-23 * * *"
  workflow_dispatch:
    inputs:
      test_email:
        description: "Send a dry run to this address only (no real subscribers touched). Leave blank for a real send."
        required: false
        type: string

permissions:
  contents: write

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Send emails
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          SHEET_CSV_URL: "https://docs.google.com/spreadsheets/d/e/2PACX-1vTovrEdHL4X1r2Ssr33DFqaE1377ivWVnyBO20I71LzI5YN9lWCzfNsL53QHMMs2DZD6Y1VGjlMlZGM/pub?gid=1289964439&single=true&output=csv"
          FROM_ADDRESS: "What If Biden Did It? <email@whatifbidendidit.com>"
          TEST_EMAIL: ${{ github.event.inputs.test_email }}
        run: node .github/scripts/send-emails.js

      - name: Save send-state if it changed
        run: |
          git config user.name "atxheathen"
          git config user.email "atxheathen@users.noreply.github.com"
          git add .github/scripts/state.json
          git diff --cached --quiet && echo "No state change." || (git commit -m "Update email send-state [skip ci]" && git push)
